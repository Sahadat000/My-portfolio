name: Update portfolio data

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - data.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from GitHub
        run: python3 update.py
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}

      - name: Save changes
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update portfolio data" && git push)
