<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SahadatLabs Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2f5;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #d3dbe4;
    --accent: #e09f3e;
    --accent-ink: #14213d;
    --me: #14213d;
    --me-ink: #ffffff;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101a2e;
      --card: #18253e;
      --ink: #e8edf5;
      --muted: #9aa8bf;
      --line: #2a3a58;
      --accent: #e8a94d;
      --accent-ink: #14213d;
      --me: #e8a94d;
      --me-ink: #14213d;
      --err: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .screen { display: none; height: 100%; }
  .screen.on { display: flex; flex-direction: column; }

  /* Lock screen */
  #lock { justify-content: center; align-items: center; padding: 24px; }
  .lockbox { width: 100%; max-width: 360px; }
  .lockbox h1 { font-size: 26px; margin: 0 0 4px; font-weight: 600; }
  .lockbox p { margin: 0 0 20px; color: var(--muted); }
  input, button { font: inherit; }
  .field {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  .field:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary {
    width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .6; }
  #lockErr { color: var(--err); min-height: 1.5em; margin-top: 10px; font-size: 15px; }

  /* Chat */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 56px 12px 16px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header strong { font-weight: 600; }
  header button {
    background: none; border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 15px;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 15px; text-align: center; }
  .msg.err { align-self: center; color: var(--err); font-size: 15px; text-align: center; }
  #chips { display: flex; gap: 8px; padding: 8px 12px 0; overflow-x: auto; background: var(--card); border-top: 1px solid var(--line); }
  #chips button { flex: none; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 15px; cursor: pointer; }
  #chips button:disabled { opacity: .6; }
  form#bar {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--card);
  }
  #text { flex: 1; min-width: 0; }
  .icon {
    flex: none; width: 46px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--paper); color: var(--ink); border: 1.5px solid var(--line);
    display: grid; place-items: center;
  }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon.rec { background: var(--err); color: #fff; border-color: var(--err); }
  .send { flex: none; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .6; }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: pop .15s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<section id="lock" class="screen on">
  <form class="lockbox" id="lockForm">
    <h1>SahadatLabs</h1>
    <p>Enter the password to use the assistant.</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <button class="primary" id="lockBtn" type="submit">Unlock</button>
    <div id="lockErr" role="alert"></div>
  </form>
</section>

<section id="app" class="screen">
  <header>
    <strong>SahadatLabs Assistant</strong>
    <button id="logout" type="button">Lock</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="chips">
    <button type="button" data-cmd="repos">My repos</button>
    <button type="button" data-cmd="status">Site status</button>
    <button type="button" data-cmd="views">Visitors</button>
  </div>
  <form id="bar">
    <button class="icon" id="mic" type="button" aria-label="Voice input">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input class="field" id="text" type="text" placeholder="Type or speak a command" aria-label="Message" autocomplete="off">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</section>

<script>
  // Set this to your Worker URL, with no trailing slash.
  const WORKER_URL = "https://portfolio-assistant.sahadatahammed00.workers.dev";

  const $ = (id) => document.getElementById(id);
  const lock = $("lock"), app = $("app"), log = $("log");
  let token = sessionStorage.getItem("sl_token") || "";
  let history = [];
  let busy = false;
  let provider = "auto";
  try { provider = localStorage.getItem("sl_provider") || "auto"; } catch (e) {}
  const PROVIDERS = { groq: "Groq", gemini: "Gemini", auto: "Auto" };

  function show(isApp) {
    lock.classList.toggle("on", !isApp);
    app.classList.toggle("on", isApp);
    if (isApp && !log.children.length) {
      add("sys", "Say or type a command, for example: show my repos, or add my-bot to portfolio.");
    }
  }

  function add(kind, text) {
    const d = document.createElement("div");
    d.className = "msg " + kind;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function api(path, body, auth) {
    const headers = { "Content-Type": "application/json" };
    if (auth) headers.Authorization = "Bearer " + token;
    let r;
    try {
      r = await fetch(WORKER_URL + path, { method: "POST", headers, body: JSON.stringify(body), signal: AbortSignal.timeout(45000) });
    } catch (e) {
      throw new Error("Taking too long. Please try again or use a shorter command.");
    }
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) {
      const e = new Error(data.error || "Request failed (" + r.status + ")");
      e.status = r.status;
      throw e;
    }
    return data;
  }

  function lockUp(msg) {
    token = "";
    sessionStorage.removeItem("sl_token");
    history = [];
    log.innerHTML = "";
    $("lockErr").textContent = msg || "";
    show(false);
  }

  $("lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("lockBtn");
    btn.disabled = true;
    $("lockErr").textContent = "";
    try {
      const { token: t } = await api("/login", { password: $("pw").value }, false);
      token = t;
      sessionStorage.setItem("sl_token", t);
      $("pw").value = "";
      show(true);
    } catch (err) {
      $("lockErr").textContent = err.status === 401 ? "Wrong password." : err.status === 429 ? "Too many attempts. Wait a minute." : "Could not reach the server. Check WORKER_URL.";
    } finally {
      btn.disabled = false;
    }
  });

  $("logout").addEventListener("click", () => lockUp(""));

  $("bar").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("text");
    const text = input.value.trim();
    if (!text || busy) return;
    const sw = text.match(/^(?:use|switch to)\s+(groq|grok|gemini|auto)\s*$/i);
    if (sw) {
      let p = sw[1].toLowerCase();
      if (p === "grok") p = "groq";
      provider = p;
      try { localStorage.setItem("sl_provider", p); } catch (e) {}
      input.value = "";
      add("me", text);
      add("sys", p === "auto"
        ? "AI: Auto. Groq first, Gemini as backup."
        : "AI set to " + PROVIDERS[p] + ". If its limit ends, the other one takes over automatically.");
      return;
    }
    if (/^(which ai|current ai)\??$/i.test(text)) {
      input.value = "";
      add("me", text);
      add("sys", "Current AI: " + PROVIDERS[provider] + ". Say: use groq, use gemini, or use auto.");
      return;
    }
    busy = true;
    $("send").disabled = true;
    input.value = "";
    add("me", text);
    history.push({ role: "user", content: text });
    const wait = add("sys", "Working…");
    try {
      const { reply, provider: used, switched } = await api("/chat", { messages: history, provider }, true);
      wait.remove();
      add("bot", reply || "(no reply)");
      if (used) add("sys", "via " + used + (switched ? " (switched automatically)" : ""));
      history.push({ role: "assistant", content: reply || "" });
    } catch (err) {
      wait.remove();
      if (err.status === 401) {
        lockUp("Session expired. Enter the password again.");
      } else {
        history.pop();
        add("err", "Error: " + err.message);
      }
    } finally {
      busy = false;
      $("send").disabled = false;
    }
  });

  // Instant buttons (no AI, no waiting)
  document.querySelectorAll("#chips button").forEach((b) => {
    b.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      document.querySelectorAll("#chips button").forEach((x) => (x.disabled = true));
      add("me", b.textContent);
      const wait = add("sys", "Loading\u2026");
      try {
        const { reply } = await api("/quick", { cmd: b.dataset.cmd }, true);
        wait.remove();
        add("bot", reply);
      } catch (err) {
        wait.remove();
        if (err.status === 401) lockUp("Session expired. Enter the password again.");
        else add("err", "Error: " + err.message);
      } finally {
        busy = false;
        document.querySelectorAll("#chips button").forEach((x) => (x.disabled = false));
      }
    });
  });

  // Voice input (Bengali, Bangladesh)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("mic");
  if (!SR) {
    mic.addEventListener("click", () => {
      add("sys", "Voice is not supported in this browser. Use the microphone key on your phone keyboard instead.");
    });
  } else {
    const rec = new SR();
    rec.lang = "bn-BD";
    rec.interimResults = false;
    rec.continuous = false;
    let on = false;
    rec.onresult = (ev) => {
      const t = Array.from(ev.results).map((r) => r[0].transcript).join(" ").trim();
      if (t) $("text").value = ($("text").value + " " + t).trim();
    };
    rec.onend = () => { on = false; mic.classList.remove("rec"); };
    rec.onerror = (ev) => {
      on = false;
      mic.classList.remove("rec");
      const why = ev.error === "not-allowed" || ev.error === "service-not-allowed"
        ? "Microphone is blocked. Allow microphone for this site in browser settings, or use the keyboard mic key."
        : "Voice error: " + ev.error;
      add("err", why);
    };
    mic.addEventListener("click", () => {
      if (on) { rec.stop(); return; }
      try { rec.start(); on = true; mic.classList.add("rec"); }
      catch (e) { add("err", "Could not start voice: " + e.message); }
    });
  }

  show(!!token);
</script>
</body>
</html>
