<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পোর্টফোলিও</title>
<style>
  :root { --bg:#0b1220; --card:#131c2e; --text:#e8edf7; --muted:#97a3b9; --accent:#2dd4bf; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; line-height:1.6; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }
  header { padding:56px 0 24px; }
  header h1 { font-size:2.2rem; }
  header p { color:var(--muted); margin-top:8px; max-width:640px; }
  h2 { margin:40px 0 16px; font-size:1.3rem; color:var(--accent); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:24px; }
  .stat { background:var(--card); border:1px solid #1f2b44; border-radius:14px; padding:16px; text-align:center; }
  .stat b { display:block; font-size:1.8rem; color:var(--accent); }
  .stat span { color:var(--muted); font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid #1f2b44; border-radius:14px; padding:20px; }
  .card h3 { margin-bottom:6px; font-size:1.05rem; }
  .card p { color:var(--muted); font-size:.92rem; }
  .meta { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tag { background:#0f2a2a; color:var(--accent); padding:2px 10px; border-radius:20px; font-size:.78rem; }
  .small { color:var(--muted); font-size:.78rem; }
  .big { font-size:1.6rem; color:var(--accent); font-weight:700; }
  .links a { display:inline-block; margin:6px 8px 0 0; padding:10px 18px; background:var(--accent);
             color:#06231f; border-radius:10px; text-decoration:none; font-weight:600; }
  a.card-link { color:inherit; text-decoration:none; }
  footer { margin-top:48px; color:var(--muted); font-size:.82rem; text-align:center; }
  #error { display:none; background:#3a1d1d; padding:16px; border-radius:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">...</h1>
    <p id="tagline"></p>
    <p id="about"></p>
    <div class="stats" id="stats"></div>
  </header>

  <div id="error">তথ্য লোড করা যায়নি। কিছুক্ষণ পরে আবার চেষ্টা করুন।</div>

  <h2>আমার প্রজেক্ট ও এজেন্ট</h2>
  <div class="grid" id="repos"></div>

  <h2>সোশ্যাল মিডিয়া পেজ</h2>
  <div class="grid" id="pages"></div>

  <h2>যোগাযোগ</h2>
  <div class="links" id="contact"></div>

  <footer id="updated"></footer>
</div>

<script>
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function safeUrl(u) { return /^https?:\/\//.test(u || '') ? u : '#'; }
function bn(n) { return Number(n || 0).toLocaleString('bn-BD'); }
function dateBn(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleDateString('bn-BD', { year:'numeric', month:'long', day:'numeric' });
}

fetch('data.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById('error').style.display = 'block'; });

function render(d) {
  const p = d.profile || {};
  const repos = (d.github && d.github.repos) || [];
  const pages = (d.facebook && d.facebook.pages) || [];

  document.title = (p.name || 'পোর্টফোলিও') + ' | পোর্টফোলিও';
  document.getElementById('name').textContent = p.name || '';
  document.getElementById('tagline').textContent = p.tagline || '';
  document.getElementById('about').textContent = p.about || '';

  const totalFollowers = pages.reduce((s, x) => s + (Number(x.followers) || 0), 0);
  const stats = document.getElementById('stats');
  [[repos.length, 'প্রজেক্ট'], [pages.length, 'সোশ্যাল পেজ'], [totalFollowers, 'মোট ফলোয়ার']].forEach(([n, l]) => {
    const s = el('div', 'stat');
    s.append(el('b', '', bn(n)), el('span', '', l));
    stats.append(s);
  });

  const rbox = document.getElementById('repos');
  repos.forEach(r => {
    const c = el('div', 'card');
    c.append(el('h3', '', r.name), el('p', '', r.description || 'বিবরণ শীঘ্রই যোগ হবে।'));
    const m = el('div', 'meta');
    if (r.language) m.append(el('span', 'tag', r.language));
    if (r.private) m.append(el('span', 'small', '🔒 কোড প্রাইভেট'));
    if (r.updated) m.append(el('span', 'small', 'শেষ আপডেট: ' + dateBn(r.updated)));
    c.append(m);
    rbox.append(c);
  });

  const pbox = document.getElementById('pages');
  pages.forEach(pg => {
    const a = el('a', 'card-link');
    a.href = safeUrl(pg.url); a.target = '_blank'; a.rel = 'noopener';
    const c = el('div', 'card');
    c.append(el('h3', '', pg.name), el('div', 'big', bn(pg.followers)), el('p', '', 'ফলোয়ার'));
    a.append(c);
    pbox.append(a);
  });

  const cbox = document.getElementById('contact');
  if (p.email) { const a = el('a', '', 'ইমেইল'); a.href = 'mailto:' + p.email; cbox.append(a); }
  if (p.github) { const a = el('a', '', 'GitHub'); a.href = safeUrl(p.github); a.target = '_blank'; a.rel = 'noopener'; cbox.append(a); }

  if (d.updated) document.getElementById('updated').textContent = 'সর্বশেষ আপডেট: ' + dateBn(d.updated);
}
</script>
</body>
</html>
