<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahadat000 — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#101A3D; --muted:#5B6485; --line:#DDE1EE;
  --accent:#3347FF; --accent-ink:#FFFFFF; --mark:#FFD84D;
  --yt:#E5322D; --fb:#1877F2; --gh:#101A3D;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0C1126;--surface:#151C38;--ink:#EEF0FA;--muted:#9AA3C4;--line:#262F55;--accent:#7C8BFF;--accent-ink:#0C1126;--gh:#EEF0FA}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Hind Siliguri",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:"Bricolage Grotesque","Hind Siliguri",sans-serif;line-height:1.1;margin:0}

nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
nav .logo{font:800 20px "Bricolage Grotesque",sans-serif;text-decoration:none}
nav a.cta{font-weight:600;text-decoration:none;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px}

.hero{padding:56px 0 40px}
.hero h1{font-size:clamp(44px,9vw,104px);font-weight:800;letter-spacing:-.03em;max-width:12ch}
.hero h1 span{background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 92%,transparent 92%)}
.hero p{font-size:clamp(18px,2.4vw,22px);color:var(--muted);max-width:34ch;margin:22px 0 0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px}
.stats div{font-size:15px;color:var(--muted)}
.stats b{display:block;font:700 30px "Bricolage Grotesque",sans-serif;color:var(--ink)}

.work{padding:36px 0 20px}
.bar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.bar h2{font-size:clamp(28px,4vw,40px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 15px "Hind Siliguri",sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:20px;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.card[data-t=github]{--c:var(--gh)} .card[data-t=youtube]{--c:var(--yt)} .card[data-t=facebook]{--c:var(--fb)}
.head{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 18px "Bricolage Grotesque",sans-serif;overflow:hidden;flex:none}
.card[data-t=github] .av{color:var(--bg);border-radius:10px}
.av img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:20px;overflow-wrap:anywhere}
.kind{font-size:14px;color:var(--muted)}
.card p{margin:0;color:var(--muted);font-size:16px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.meta span{background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.empty{padding:40px 0;color:var(--muted)}

.contact{margin:60px 0 0;padding:56px 0 64px;background:var(--ink);color:var(--bg)}
.contact h2{font-size:clamp(30px,5vw,52px);max-width:16ch}
.contact p{max-width:40ch;opacity:.8}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.links a{background:var(--mark);color:#101A3D;font-weight:600;text-decoration:none;padding:11px 22px;border-radius:999px}
.links a.alt{background:transparent;color:var(--bg);border:1.5px solid currentColor}
footer{text-align:center;font-size:14px;color:var(--muted);padding:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="logo" href="#" id="logo">Sahadat000</a><a class="cta" href="#contact">Contact</a></nav>
  <header class="hero">
    <h1 id="tagline"><span>Turning Ideas</span> into Powerful Solutions</h1>
    <p id="intro">Code, channels and pages I have built and managed for clients.</p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="work" id="work" aria-labelledby="wt">
    <div class="bar">
      <h2 id="wt">Work</h2>
      <div class="chips" id="chips" role="group" aria-label="Filter work"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing here yet. Add items to data.json.</p>
  </section>
</div>

<section class="contact" id="contact">
  <div class="wrap">
    <h2>Have a project in mind?</h2>
    <p>Send me a message and tell me what you want to build or grow.</p>
    <div class="links" id="links"></div>
  </div>
</section>
<footer id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KIND = {github:"GitHub project", youtube:"YouTube channel", facebook:"Facebook page"};
const FILTERS = [["all","All"],["github","Code"],["youtube","YouTube"],["facebook","Facebook"]];
let items = [], active = "all";

function build(d){
  const p = d.profile || {};
  if (p.name) { $("logo").textContent = p.name; document.title = p.name + " — Portfolio"; }
  if (p.tagline) $("tagline").textContent = p.tagline;
  if (p.intro) $("intro").textContent = p.intro;

  const gh = (d.github && d.github.repos) || [];
  const yt = (d.youtube && d.youtube.channels) || [];
  const fb = (d.facebook && d.facebook.pages) || [];

  items = [
    ...yt.map(x => ({t:"youtube", name:x.name, url:x.url, desc:x.description, role:x.role, tag:x.subscribers && x.subscribers + " subscribers", img:x.avatar})),
    ...fb.map(x => ({t:"facebook", name:x.name, url:x.url, desc:x.description, role:x.role, tag:x.followers && x.followers + " followers", img:x.avatar})),
    ...gh.map(x => ({t:"github", name:x.name, url:(p.github||"https://github.com") + "/" + x.name, desc:x.description, role:x.language, tag:x.updated && "Updated " + x.updated, priv:x.private}))
  ];

  $("stats").innerHTML = [[yt.length,"YouTube channels"],[fb.length,"Facebook pages"],[gh.length,"Code projects"]]
    .filter(s => s[0]).map(s => `<div><b>${s[0]}</b>${s[1]}</div>`).join("");

  $("chips").innerHTML = FILTERS.filter(f => f[0]==="all" || items.some(i => i.t===f[0]))
    .map(f => `<button class="chip" data-f="${f[0]}" aria-pressed="${f[0]===active}">${f[1]}</button>`).join("");
  $("chips").onclick = e => { const b = e.target.closest("button"); if(!b) return; active = b.dataset.f;
    [...$("chips").children].forEach(c => c.setAttribute("aria-pressed", c.dataset.f===active)); render(); };

  const s = p.socials || {}, L = [];
  if (s.facebook) L.push(["Message on Facebook", s.facebook]);
  if (s.email) L.push(["Email me", "mailto:" + s.email]);
  if (s.whatsapp) L.push(["WhatsApp", s.whatsapp]);
  if (p.github) L.push(["GitHub", p.github, 1]);
  $("links").innerHTML = L.map(l => `<a class="${l[2]?"alt":""}" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("");
  $("foot").textContent = d.updated ? "Updated " + d.updated : "";
  render();
}

function render(){
  const list = items.filter(i => active==="all" || i.t===active);
  $("empty").hidden = list.length > 0;
  $("grid").innerHTML = list.map(i => {
    const av = i.img ? `<img src="${esc(i.img)}" alt="" loading="lazy">` : esc((i.name||"?").trim().charAt(0).toUpperCase());
    return `<a class="card" data-t="${i.t}" href="${esc(i.url)}" target="_blank" rel="noopener">
      <div class="head"><div class="av">${av}</div><div><h3>${esc(i.name)}</h3><div class="kind">${KIND[i.t]}${i.priv?" · private":""}</div></div></div>
      ${i.desc ? `<p>${esc(i.desc)}</p>` : `<p></p>`}
      <div class="meta">${i.role?`<span>${esc(i.role)}</span>`:""}${i.tag?`<span>${esc(i.tag)}</span>`:""}</div></a>`;
  }).join("");
}

fetch("data.json", {cache:"no-cache"}).then(r => r.json()).then(build)
  .catch(() => { $("empty").hidden = false; $("empty").textContent = "Could not load data.json. Open this page from your site, not as a local file."; });
</script>
</body>
</html>
